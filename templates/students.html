<!DOCTYPE html>
<html>

<head>

<title>Student Skills</title>

<style>

body{
    font-family: Arial;
    background:#f4f6f8;
    text-align:center;
}

table{
    margin:auto;
    border-collapse:collapse;
    width:60%;
    background:white;
}

th, td{
    padding:12px;
    border:1px solid #ddd;
}

th{
    background:#3498db;
    color:white;
}

tr:hover{
    background:#f1f1f1;
}

a button{
    margin-top:20px;
    padding:10px 20px;
    border:none;
    background:#27ae60;
    color:white;
    border-radius:5px;
}

</style>

</head>

<body>

<h1>Student Skill List</h1>

<table>

<tr>
<th>Name</th>
<th>Skill</th>
</tr>

{% for s in students %}

<tr>
<td>{{s.name}}</td>
<td>{{s.skill}}</td>
</tr>

{% endfor %}

</table>

<br>

<a href="/">
<button>Back to Home</button>
</a>

</body>

</html>
