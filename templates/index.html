<!DOCTYPE html>
<html>

<head>

<title>Student Skill Tracker</title>

<style>

body{
    font-family: Arial, sans-serif;
    background-color:#f4f6f8;
    text-align:center;
}

.container{
    width:60%;
    margin:auto;
    background:white;
    padding:30px;
    margin-top:50px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    color:#2c3e50;
}

input, select{
    width:80%;
    padding:10px;
    margin:10px;
    border-radius:5px;
    border:1px solid #ccc;
}

button{
    padding:10px 20px;
    border:none;
    background:#3498db;
    color:white;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#2980b9;
}

.links{
    margin-top:20px;
}

.links a{
    text-decoration:none;
}

.links button{
    background:#27ae60;
}

.links button:hover{
    background:#1e8449;
}

</style>

</head>

<body>

<div class="container">

<h1>Student Skill Tracker</h1>

<h3>Add Student Skill</h3>

<form action="/add" method="POST">

<input type="text" name="name" placeholder="Enter Student Name" required>

<br>

<input type="text" name="skill" placeholder="Enter Skill (Python, AI, etc)" required>

<br>

<button type="submit">Add Student</button>

</form>

<div class="links">

<br>

<a href="/students">
<button>View Students</button>
</a>

<br><br>

<a href="/skill_api">
<button>Skill Suggestions (API)</button>
</a>

<br><br>

<a href="/graph">
<button>Skill Graph</button>
</a>

</div>

</div>

</body>

</html>
